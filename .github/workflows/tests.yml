name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Optional libraries let the GUI and Ollama-client tests run.
      # meshtastic and chromadb are not needed: those tests use fakes.
      - run: pip install pyyaml flask ollama
      - run: python -m unittest discover -s tests -t . -v

  minimal:
    name: unittest (stdlib + pyyaml only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -t .

  requirements:
    name: unittest (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Everything operators install, so a dependency release that breaks
      # Del-Fi fails here (this job also runs the real-ChromaDB test).
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
