# Del-Fi configuration (v0.3)
# Copy this file to config.yaml and edit it. Every key except node_name is
# optional; defaults are shown commented out. Full reference:
# .claude/spec-config.md
#
# After adding documents to knowledge/, compile them:
#   python main.py --build-wiki
# Then run the daemon:
#   python main.py            (or --simulator to test without a radio)

# --- Required ---
node_name: "MAPLEWOOD-ORACLE"

# --- Model ---
model: "gemma4:e4b"   # Raspberry Pi: start with gemma3:1b or llama3.2:1b
# wiki_builder_model: "gemma4:12b"   # bigger model for --build-wiki (falls back to model)
# ollama_host: "http://localhost:11434"
# ollama_timeout: 120                # seconds per answer
# ollama_keep_alive: -1              # keep the model loaded (-1), or unload after e.g. "30m" idle
# num_predict: 300                   # max output tokens
# num_ctx:                           # empty = derived from max_context_tokens
# embedding_model: "nomic-embed-text"  # optional semantic search (needs chromadb)

# --- Persona ---
# oracle_type: community-hub   # observatory | community-hub | emergency | event | lore (GUI label)
# fallback_message: ""         # empty = suggest known topics when nothing matches
#
# --- Example: Community Hub (default) ---
# node_name: "MAPLEWOOD-ORACLE"
# model: "gemma4:e4b"
# wiki_builder_model: "gemma4:12b"
# oracle_type: community-hub
# personality: >
#   You are MAPLEWOOD-ORACLE, a community information hub for the Maplewood
#   neighborhood. You speak plainly. Answer questions about local services,
#   infrastructure, events, and organizations. Redirect emergencies to 911.
#
# --- Example: Wilderness Observatory ---
# node_name: "RIDGELINE"
# model: "gemma4:e4b"
# wiki_builder_model: "gemma4:12b"
# oracle_type: observatory
# personality: >
#   You are RIDGELINE, a field science oracle at a remote wilderness
#   observatory. You speak plainly and precisely. Prioritise safety
#   information. Distances in miles, temperatures in Fahrenheit.
#   Two sentences maximum per answer.
#
# --- Example: RPG Game Master ---
# node_name: "DUNGEON-ORACLE"
# model: "gemma4:e4b"
# oracle_type: lore
# personality: >
#   You are DUNGEON-ORACLE, the Game Master for The Shattered Realm.
#   You speak in vivid present tense. Every answer moves the adventure forward.
#   2-3 sentences max. Sign off: // DUNGEON-ORACLE

# --- Radio ---
# mesh_protocol: meshtastic      # meshtastic | meshcore (stub)
# radio_connection: serial       # serial | tcp | ble
# radio_port: /dev/ttyUSB0       # or host[:port] for TCP (default port 4403)
# want_ack: true                 # radio retries DMs until acknowledged
# max_response_bytes: 230        # per LoRa message
# auto_send_chunks: 3            # parts sent before !more is needed

# --- Questions: rate limit and queue ---
# rate_limit_seconds: 30         # one question per sender per window (0 = off)
# rate_limit_notice: true        # tell a sender once when they're going too fast
# query_queue_size: 10           # questions waiting for the LLM
# busy_notice: true              # tell queued senders their place in line
# response_cache_ttl: 300        # seconds a repeated question reuses its answer
# persistent_cache: true

# --- Knowledge / Wiki ---
# knowledge_folder: ./knowledge          # relative to this file
# wiki_folder: ./wiki
# wiki_rebuild_on_start: false           # rebuild at daemon startup (blocking)
# wiki_watch_enabled: true               # recompile changed files, drop deleted ones
# wiki_watch_interval_seconds: 60
# wiki_patch_model: ""                   # model the watcher uses (default: model)
# wiki_stale_after_days: 30              # --lint-wiki stale threshold
# time_sensitive_files:                  # passages get "last updated N hrs ago"
#   - weather-station.md
#   - trail-camera-log.md
#   - community-log.md

# --- Retrieval ---
# max_context_tokens: 1500       # how much of your documents the model reads
# similarity_threshold: 0.28     # semantic-search cutoff; higher = stricter
# rag_top_k: 4                   # semantic-search results

# --- Sensor / FactStore (Tier 0) ---
# External scripts write readings to cache/sensor_feed.json
# (format: examples/sensor_feed.example.json). Questions containing these
# words are answered straight from the feed, no LLM.
#
# fact_feed_file: ""             # default: cache/sensor_feed.json
# fact_watch_interval_seconds: 30
# fact_query_keywords:
#   - temperature
#   - humidity
#   - wind
#   - pressure
#   - battery
#   - solar

# --- Conversation Memory (off by default) ---
# Per-sender history so the oracle remembers what it said and to whom.
# Memory eats context window tokens, so keep turns low on small models.
#
# memory_max_turns: 5            # 0 = disabled (default)
# memory_ttl: 3600               # seconds before a conversation expires
# persistent_memory: false       # save memory to disk across restarts

# --- Community Board (off by default) ---
# Users post with !post <message> and read with !board (recent) or
# !board <topic> (search). !unpost removes a user's own posts.
#
# board_enabled: true
# board_max_posts: 50
# board_post_ttl: 86400          # seconds before posts expire (24 hrs)
# board_show_count: 5            # posts per !board
# board_persist: true
# board_rate_limit: 3            # posts per sender per window
# board_rate_window: 3600
# board_blocked_patterns:        # extra regexes to reject
#   - "badword"
#   - "spam.*link"

# --- Peers + Gossip (off by default) ---
# Gossip: announce this node's topics and hear other Del-Fi nodes, so
# questions you can't answer get a referral ("Try NODE (!id) — covers …").
# Peers: nodes whose answers you trust, by hardware node ID (display names
# are not authenticated). Peer answer sync is on the roadmap.
#
# mesh_knowledge:
#   gossip:
#     enabled: true
#     announce_interval: 4h      # minimum 15m
#     directory_ttl: 24h
#     channel: 0
#   peers:
#     - node_id: "!a1b2c3d4"
#       name: "MARINA-ORACLE"

# --- MeshCore (only when mesh_protocol: meshcore; adapter is a stub) ---
# meshcore:
#   port: "/dev/ttyUSB0"          # serial port or host:port for TCP
#   connection: serial            # serial | tcp
#   baud_rate: 115200

# --- Logging ---
# log_level: info                # debug | info | warning | error
# log_file: ""                   # e.g. delfi.log (rotated at 1 MB x 3)
